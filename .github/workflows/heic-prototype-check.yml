name: HEIC decoder prototype compile check
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [feature/mobile-photo-compat-20261102]
    paths:
      - "experiments/heic-poc/**"
      - ".github/workflows/heic-prototype-check.yml"
permissions:
  contents: read
jobs:
  build-prototype-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: experiments/heic-poc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned prototype dependencies, no package lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run strictly local header checks
        run: npm test
      - name: Bundle isolated browser-only worker
        run: npm run build
      - name: Report generated worker size only
        run: ls -lh site/decoder.worker.js
      - name: Decode genuine CC0 HEIC in headless Chrome under strict CSP
        run: |
          curl --fail --location --silent --show-error --max-time 30 https://loremfile.dev/heic/640x480.heic --output site/sample.heic
          test "$(wc -c < site/sample.heic)" -eq 5066
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          python3 -m http.server 8099 --bind 127.0.0.1 --directory site >/tmp/heic-poc-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          timeout 45 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=25000 --dump-dom http://127.0.0.1:8099/ci-test.html >/tmp/heic-poc-result.html 2>/tmp/heic-poc-chrome.log
          if ! grep -q 'data-test="PASS"' /tmp/heic-poc-result.html; then
            grep -o 'data-test="[^"]*"\|data-detail="[^"]*"' /tmp/heic-poc-result.html | head -5 || true
            grep -i 'Content Security Policy\|Error\|worker' /tmp/heic-poc-chrome.log | head -10 || true
            exit 1
          fi
          echo 'Browser HEIC to JPEG under strict CSP: PASS'
